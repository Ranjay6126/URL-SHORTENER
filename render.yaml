{
  "services": [
    {
      "type": "web",
      "name": "snapurl",
      "runtime": "node",
      "plan": "free",
      "buildCommand": "npm --prefix frontend install && npm --prefix frontend run build && npm --prefix backend install",
      "startCommand": "npm --prefix backend start",
      "healthCheckPath": "/api/health",
      "envVars": [
        { "key": "NODE_ENV", "value": "production" },
        { "key": "MONGO_URI", "sync": false },
        { "key": "JWT_SECRET", "generateValue": true },
        { "key": "ADMIN_EMAIL", "sync": false },
        { "key": "CLIENT_URL", "sync": false }
      ]
    }
  ]
}
